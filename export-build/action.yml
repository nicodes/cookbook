name: Export single-job build outputs
description: >-
  Stage the accepted build outputs of the build job as a packet, upload it as a workflow artifact and report the
  digest of its proof as an output. Call it right after build, in the job named build; the other jobs of the run
  import the packet with import-build and verify it against that digest. The caller puts its deadline on this step.
outputs:
  digest:
    description: SHA-256 of the packet proof, which binds every output file
    value: ${{ steps.pack.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Stage the build outputs as a verified packet
      id: pack
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -I -B -c 'import pathlib, runpy, sys;entry = pathlib.Path(sys.argv[1]);sys.argv = sys.argv[1:];sys.path.insert(0, str(entry.parent));runpy.run_path(str(entry), run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/ci.py --mode "$COOKBOOK_MODE" --source "$SOURCE_SHA" --cookbook-ref "$COOKBOOK_SHA" --single-job --phase pack
    - name: Upload the build packet
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: cookbook-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/godot-export
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1
