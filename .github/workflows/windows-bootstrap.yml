name: Windows SDK bootstrap
'on':
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: windows-bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bootstrap:
    name: Windows bootstrap (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare exact Mise and the caller-pinned Python SDK
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: '2026.9.12'
          sha256: ${{ runner.arch == 'ARM64' && '6beeb61b829ba60ef3bb1fdda5717a41b8fb91bd400109de8b05b1700a107d8e' || '8bc3a2c46246bb00fc49f467c678cf9ff321f707c533ad707061d0f8c7b639b2' }}
          install_args: python
      - name: Explicitly prepare the checked generic SDK source
        run: |
          mise run _tools -- setup helpers/pinned-tools.py exec --tool python=python3 -- python3 -I -B -c 'import pathlib, runpy, sys; entry=pathlib.Path(sys.argv[1]); sys.argv=sys.argv[1:]; sys.path.insert(0,str(entry.parent)); runpy.run_path(str(entry),run_name="__main__")' cookbook/provider.py source
      - name: Verify native owner and DACL protection
        run: |
          python3 -I -B - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('windows_verification', Path(os.environ['TOOLS_ROOT'])/'helpers/verification.py')
          verification = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verification)
          directory = verification.protected_directory(Path('.artifacts/bootstrap-control'))
          verification.protected_windows_acl(verification.windows_access(directory))
          print('Native owner and DACL validation passed')
          PY
      - name: Verify nested native Cargo recipe paths
        run: python3 -m unittest discover -s tests -p test_recipe_cargo_paths.py -v
      - name: Verify versioned Cookbook source discovery
        run: python3 -m unittest discover -s tests -p test_sdk_identity.py -v
      - name: Verify actual Mise task and missing-exact-SDK behavior
        run: python3 -m unittest discover -s tests -p test_mise_runtime.py -v
      - name: Verify real Cookbook bootstrap transport arguments and child exit status
        run: python3 -m unittest discover -s tests -p test_cookbook_bootstrap.py -v
