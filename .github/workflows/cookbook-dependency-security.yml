name: Source dependency security
'on':
  workflow_call:
    inputs:
      cookbook-ref:
        type: string
        required: true
      source:
        type: string
        required: true
      runner:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
      setup-timeout-minutes:
        type: number
        required: true
permissions: {}
jobs:
  audit:
    name: Source dependency audit
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Require the selected Cookbook to be accepted on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COOKBOOK_REF: ${{ inputs.cookbook-ref }}
        run: |
          set -euo pipefail
          [[ "$COOKBOOK_REF" =~ ^[a-f0-9]{40}$ ]]
          relation="$(gh api "repos/nicodes/cookbook/compare/$COOKBOOK_REF...main" --jq .status)"
          [[ "$relation" == ahead || "$relation" == identical ]]
      - name: Check out pinned dependency tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/cookbook
          ref: ${{ inputs.cookbook-ref }}
          path: .artifacts/recipe-sdks/_cookbook
          persist-credentials: false
      - name: Prepare exact source audit SDK and frozen dependencies
        timeout-minutes: ${{ inputs['setup-timeout-minutes'] }}
        uses: ./.artifacts/recipe-sdks/_cookbook/dependency-security
        with:
          source: ${{ inputs.source }}
          cookbook-ref: ${{ inputs.cookbook-ref }}
          runner: ${{ inputs.runner }}
          timeout-minutes: ${{ inputs['timeout-minutes'] }}
          setup-timeout-minutes: ${{ inputs['setup-timeout-minutes'] }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Audit complete frozen source inventories
        run: python3 -I -B -c 'import pathlib, runpy, sys;entry = pathlib.Path(sys.argv[1]);sys.argv = sys.argv[1:];sys.path.insert(0, str(entry.parent));runpy.run_path(str(entry), run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/dependency_security.py audit
