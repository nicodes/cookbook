    needs: [plan, build]
    if: needs.plan.outputs.has-gates == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.gates) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    defaults:
      run:
