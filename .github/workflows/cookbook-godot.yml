        run: python3 -I -B -c 'import pathlib, runpy, sys;entry = pathlib.Path(sys.argv[1]);sys.argv = sys.argv[1:];sys.path.insert(0, str(entry.parent));runpy.run_path(str(entry), run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/godot_ci.py run --source "$SOURCE_SHA" --cookbook-ref "$COOKBOOK_SHA" --entry "$GODOT_ENTRY"
