  full_host:
    name: Godot host
    needs: [plan, build, units, gates]
    if: always() && needs.plan.result == 'success' && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.units.result) && contains(fromJSON('["success","skipped"]'), needs.gates.result)
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/cookbook-validation.yml
    with:
      cookbook-ref: ${{ inputs.cookbook-ref }}
      source: ${{ inputs.source }}
      mode: full
      runner: ${{ needs.plan.outputs.host-runner }}
      timeout-minutes: ${{ fromJSON(needs.plan.outputs.host-timeout) }}
