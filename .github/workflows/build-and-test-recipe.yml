name: Build and test (recipe)
'on':
  workflow_call:
    inputs:
      cookbook-ref:
        type: string
        required: true
      source:
        type: string
        required: true
      recipe:
        type: string
        default: godot-addon
      preview-environment:
        type: string
        default: ''
      preview-number:
        type: string
        default: ''
      preview-app-origin:
        type: string
        default: ''
      preview-api-origin:
        type: string
        default: ''
      preview-public-key:
        type: boolean
        default: false
      head:
        type: string
        default: ''
      base:
        type: string
        default: ''
      runner:
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        type: number
        default: 30
permissions: {}
jobs:
  full:
    name: Test
    if: contains(fromJSON('["godot-addon","react-native"]'), inputs.recipe)
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/build-and-test-host.yml
    with:
      cookbook-ref: ${{ inputs.cookbook-ref }}
      source: ${{ inputs.source }}
      mode: full
      runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      head: ${{ inputs.head }}
      base: ${{ inputs.base }}
      preview-environment: ${{ inputs.recipe == 'react-native' && (github.event_name == 'pull_request' || inputs.head != '')
        && inputs.preview-environment || '' }}
      preview-number: ${{ inputs.preview-number }}
      preview-app-origin: ${{ inputs.preview-app-origin }}
      preview-api-origin: ${{ inputs.preview-api-origin }}
  native:
    name: Test (native)
    if: inputs.recipe == 'rust-cli'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/build-and-test-native.yml
    with:
      cookbook-ref: ${{ inputs.cookbook-ref }}
      source: ${{ inputs.source }}
      runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      head: ${{ inputs.head }}
      base: ${{ inputs.base }}
  godot:
    name: Test (Godot)
    if: inputs.recipe == 'godot-game'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/build-and-test-godot.yml
    with:
      cookbook-ref: ${{ inputs.cookbook-ref }}
      source: ${{ inputs.source }}
      runner: ${{ inputs.runner }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      head: ${{ inputs.head }}
      base: ${{ inputs.base }}
      preview-number: ${{ inputs.preview-number }}
      preview-app-origin: ${{ inputs.preview-app-origin }}
      preview-api-origin: ${{ inputs.preview-api-origin }}
      preview-environment: ${{ inputs.preview-number != '' && 'Preview' || '' }}
      preview-public-key: ${{ inputs.preview-public-key }}
  unsupported:
    name: Unsupported recipe
    if: '!contains(fromJSON(''["godot-addon","react-native","rust-cli","godot-game"]''), inputs.recipe)'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
    - name: Refuse unsupported recipe
      run: echo 'Complete orchestration for this recipe is not enrolled yet'; exit 1
