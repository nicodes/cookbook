          path: .artifacts/recipe-sdks/_cookbook
          persist-credentials: false
      - name: Prepare separate immutable Cookbook and Tools sources
        uses: ./.artifacts/recipe-sdks/_cookbook/sdk-dependencies
        with:
          cookbook-ref: ${{ inputs.cookbook-ref }}
      - name: Download this run's exact accepted bytes and proof
        if: needs.plan.outputs.operation != 'retry'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cookbook-full-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Verify and publish immutable bytes using trusted code
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PLAN: ${{ needs.plan.outputs.plan }}
          BUMP: ${{ inputs.bump }}
          TAG: ${{ inputs.tag }}
          RETRY_TAG: ${{ inputs.retry-tag }}
          RETRY_SHA256: ${{ inputs.retry-sha256 }}
        run: |
          set -euo pipefail
          python3 -I -B -c 'import pathlib, runpy, sys;entry = pathlib.Path(sys.argv[1]);sys.argv = sys.argv[1:];sys.path.insert(0, str(entry.parent));runpy.run_path(str(entry), run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/publication.py publish --bump "$BUMP" --tag "$TAG" --retry-tag "$RETRY_TAG" --retry-sha256 "$RETRY_SHA256"
      - name: Publish the verified GitHub release to the registry
        uses: aviorstudio/gdam-actions/publish@3a46007e296e60e15a4ad47727ad33046e52e6ea
        with:
          tag: ${{ steps.release.outputs.tag }}
          asset: ${{ steps.release.outputs.asset }}
